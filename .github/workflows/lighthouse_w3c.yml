name: Lighthouse & W3C Validation

on:
  # Run on every push to main and on a schedule (daily)
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: https://people-s-court.onrender.com
          # Expect high scores; fail if any metric < 90
          uploadArtifacts: true
          temporaryPublicStorage: true
          # Config to treat scores < 90 as failure
          configPath: ./.github/lighthouserc.json

  w3c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: W3C Validator
        uses: w3c/validation-action@v1
        with:
          site-url: https://people-s-court.onrender.com
          fail-on-error: true
