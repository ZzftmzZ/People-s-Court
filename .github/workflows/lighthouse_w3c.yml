name: Lighthouse & W3C Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://people-s-court.onrender.com
          uploadArtifacts: false
          temporaryPublicStorage: false
          configPath: ./.github/lighthouserc.json

  w3c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML via W3C Nu Validator
        run: |
          response=$(curl -s "https://validator.w3.org/nu/?doc=https%3A%2F%2Fpeople-s-court.onrender.com%2F&out=json")
          echo "$response"
          errors=$(echo "$response" | jq '[.messages[] | select(.type=="error")] | length')
          echo "Found $errors errors."
          if [ "$errors" -gt 0 ]; then
            echo "W3C HTML Validation failed with $errors errors."
            exit 1
          fi
          echo "W3C HTML Validation passed with 0 errors!"
