name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python manage.py migrate
      - run: python manage.py seed_data
      - run: python manage.py test core
      - run: DJANGO_DEBUG=False DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(60))") DJANGO_ALLOWED_HOSTS=example.com python manage.py check --deploy --fail-level WARNING
